<svg width="1024" height="1024" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f5f0"/>

  <!-- Grid lines -->
  <g stroke="#c8dfc6" stroke-width="1.5">
    <line x1="30" y1="30" x2="170" y2="30"/>
    <line x1="30" y1="57" x2="170" y2="57"/>
    <line x1="30" y1="84" x2="170" y2="84"/>
    <line x1="30" y1="111" x2="170" y2="111"/>
    <line x1="30" y1="138" x2="170" y2="138"/>
    <line x1="30" y1="165" x2="170" y2="165"/>
    <line x1="30"  y1="30" x2="30"  y2="170"/>
    <line x1="57"  y1="30" x2="57"  y2="170"/>
    <line x1="84"  y1="30" x2="84"  y2="170"/>
