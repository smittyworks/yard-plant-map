        fill="#7c3aed"/>

  <!-- Tulip right petal -->
  <path d="M100 108
           C112 108 130 95 128 65
           C126 43 111 33 100 32
           C100 32 112 68 100 108 Z"
        fill="#6d28d9"/>

  <!-- Tulip center petal -->
  <path d="M100 108 C93 88 91 58 100 32 C109 58 107 88 100 108 Z"
